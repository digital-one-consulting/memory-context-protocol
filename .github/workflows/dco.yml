name: dco

on:
  pull_request:

jobs:
  signed-off:
    name: every commit carries a Signed-off-by trailer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for c in $(git rev-list "$base".."$head"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "missing Signed-off-by: $(git log -1 --format='%h %s' "$c")"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo
            echo "Every commit must be signed off (git commit -s). See CONTRIBUTING.md."
            exit 1
          fi
          echo "all commits signed off"
